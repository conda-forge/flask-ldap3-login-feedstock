{% set name = "flask-ldap3-login" %}
{% set version = "1.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: b5011c44f791325820c159a6470aeb74319067c203e3f48ab7d1696abd00aa33

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python >=3.6
  run:
    - flask
    - flask-wtf
    - ldap3 >=2.0.7
    - python >=3.6
    - wtforms >=1.0.2

test:
  imports:
    - flask_ldap3_login
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/nickw444/flask-ldap3-login
  license: MIT
  license_file: LICENSE
  dev_url: http://flask-ldap3-login.readthedocs.io/en/latest/
  doc_url: https://github.com/nickw444/flask-ldap3-login
  summary: LDAP3 Logins for Flask/Flask-Login
  description: |
    Flask LDAP3 Login allows you to easily integrate your flask app with an
    LDAP directory. It can be used as an extension to Flask-Login and can
    even be used with Flask-Principal for permission and privilege
    management.

extra:
  recipe-maintainers:
    - ericdill
